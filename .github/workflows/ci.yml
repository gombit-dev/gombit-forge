name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # Read the toolchain from go.mod so CI never drifts from the module.
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: make fmt-check

      - name: Vet
        run: make vet

      # The .claude and .cursor skill trees are duplicated; fail on drift.
      - name: Check skill trees are in sync
        run: make skills-check

      - name: Test
        run: make test

      - name: Test with race detector
        run: make race

      # The control plane is a separate nested module (it imports Gombit), so
      # root ./... never covers it. Build, vet and test it explicitly. Its boot
      # test drives a throwaway Postgres under Docker (available on the runner)
      # and skips if Docker is absent.
      - name: Control plane — vet
        run: make cp-vet

      - name: Control plane — build
        run: make cp-build

      - name: Control plane — test
        run: make cp-test
