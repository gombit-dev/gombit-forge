name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          # Read the toolchain from go.mod so CI never drifts from the module.
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: make fmt-check

      - name: Vet
        run: make vet

      # The .claude and .cursor skill trees are duplicated; fail on drift.
      - name: Check skill trees are in sync
        run: make skills-check

      - name: Test
        run: make test

      - name: Test with race detector
        run: make race

      # The control plane is a separate nested module (it imports Gombit), so
      # root ./... never covers it. Build, vet and test it explicitly. Its go.mod
      # follows Gombit's go directive (1.26.9 as of v0.10.0), newer than the root
      # module's toolchain setup-go installed above, so let the go command fetch
      # the one it asks for.
      - name: Control plane — vet
        env:
          GOTOOLCHAIN: auto
        run: make cp-vet

      - name: Control plane — build
        env:
          GOTOOLCHAIN: auto
        run: make cp-build

      # -short here, like the M0 e2e gate: the boot test drives a throwaway
      # Postgres under Docker and is the local acceptance proof, but bringing a
      # cold container up inside the test is too slow/flaky for the merge gate.
      # `make cp-test` (no -short) runs it locally where the image is warm.
      - name: Control plane — test (short)
        env:
          GOTOOLCHAIN: auto
        run: make cp-test-short

  # The Forge editor SPA (controlplane/web) is a separate npm project the Go
  # gates never cover, so it gets its own job: typecheck, build and unit-test.
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: controlplane/web/package-lock.json

      - name: Install
        run: make web-install

      - name: Typecheck
        run: make web-check

      - name: Build
        run: make web-build

      - name: Test
        run: make web-test

      # The generated client must be what gombit generates from the committed
      # contract (controlplane/openapi.json), with the gombit CLI the control
      # plane pins. The contract itself is held to the code by the control
      # plane's Go tests.
      - uses: actions/setup-go@v7
        with:
          go-version-file: controlplane/go.mod
          cache: false

      - name: Generated client is current
        env:
          GOTOOLCHAIN: auto
        run: |
          go install "github.com/gombit-dev/gombit/cmd/gombit@$(cd controlplane && go list -m -f '{{.Version}}' github.com/gombit-dev/gombit)"
          make contract-check
  # The editor in a real browser against a real control plane (`make web-e2e`):
  # the Go server on a Postgres with the committed migrations, and the built
  # SPA. The `web` job's unit tests stub fetch, so the cookie session, the CSRF
  # double-submit and the generated client's requests are only proven here.
  web-e2e:
    name: Editor end-to-end (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: controlplane/go.mod
          cache: true
          cache-dependency-path: controlplane/go.sum

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: controlplane/web/package-lock.json

      - uses: ./.github/actions/install-atlas

      - name: Install
        run: make web-install

      - name: Install Chromium
        working-directory: controlplane/web
        run: npx playwright install --with-deps chromium

      - name: Editor end-to-end
        run: make web-e2e

      - name: Keep the Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            controlplane/web/playwright-report
            controlplane/web/test-results
          retention-days: 7

# Informational, not a gate (mirrors gombit-docs' CI). The vulnerabilities
  # govulncheck surfaces are overwhelmingly in the pinned Go standard library
  # (fixed by a toolchain patch bump, not by any application change here);
  # hard-gating on them would keep CI red through no fault of a PR. Bumping the
  # Go toolchain to clear stdlib advisories is tracked separately.
  govulncheck:
    name: govulncheck (informational)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Dependency vulnerabilities (govulncheck)
        continue-on-error: true
        env:
          GOTOOLCHAIN: auto
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          "$(go env GOPATH)/bin/govulncheck" ./...
