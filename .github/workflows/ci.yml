name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          # Read the toolchain from go.mod so CI never drifts from the module.
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: make fmt-check

      - name: Vet
        run: make vet

      # The .claude and .cursor skill trees are duplicated; fail on drift.
      - name: Check skill trees are in sync
        run: make skills-check

      - name: Test
        run: make test

      - name: Test with race detector
        run: make race

      # The control plane is a separate nested module (it imports Gombit), so
      # root ./... never covers it. Build, vet and test it explicitly. Its go.mod
      # follows Gombit's go directive (1.26.9 as of v0.10.0), newer than the root
      # module's toolchain setup-go installed above, so let the go command fetch
      # the one it asks for.
      - name: Control plane — vet
        env:
          GOTOOLCHAIN: auto
        run: make cp-vet

      - name: Control plane — build
        env:
          GOTOOLCHAIN: auto
        run: make cp-build

      # -short here, like the M0 e2e gate: the boot test drives a throwaway
      # Postgres under Docker and is the local acceptance proof, but bringing a
      # cold container up inside the test is too slow/flaky for the merge gate.
      # `make cp-test` (no -short) runs it locally where the image is warm.
      - name: Control plane — test (short)
        env:
          GOTOOLCHAIN: auto
        run: make cp-test-short

  # The toolchain lane (`make e2e`): the tests that scaffold a real Gombit app,
  # compile a spec into it, migrate it on Postgres, then build, boot and serve
  # it, including its generated frontend. They need the gombit CLI, atlas,
  # Docker and node, which `build` doesn't install, so they skip there. Here
  # every tool is installed and FORGE_REQUIRE_TOOLCHAIN turns a missing one into
  # a failure. gombit is the version the control plane pins, so a Gombit release
  # that breaks generated apps fails the PR that moves that pin (dependabot's or
  # an upgrade's).
  e2e:
    name: Toolchain end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Generated apps follow Gombit's go directive; let `go` fetch it.
      GOTOOLCHAIN: auto
      # The Atlas Community release gombit's own CI pins. atlasgo.sh reads
      # ATLAS_VERSION; unset, it installs "latest", which has been a canary.
      ATLAS_VERSION: v1.3.0
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: controlplane/go.mod
          cache: true
          # Keyed on both modules, so a gombit bump in the control plane saves
          # a fresh cache holding the generated apps' new dependencies.
          cache-dependency-path: |
            go.sum
            controlplane/go.sum

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install gombit (the control plane's pin)
        run: |
          go install "github.com/gombit-dev/gombit/cmd/gombit@$(cd controlplane && go list -m -f '{{.Version}}' github.com/gombit-dev/gombit)"
          gombit version

      - name: Install Atlas
        run: |
          curl -sSf https://atlasgo.sh | CI=true sh -s -- --community
          # Fail on anything but the pinned release (a canary, a newer one).
          # Trim to the first line in the shell: piping into head can SIGPIPE.
          reported="$(atlas version)"
          installed="${reported%%$'\n'*}"
          case "$installed" in
            *" $ATLAS_VERSION") echo "$installed" ;;
            *) echo "want Atlas $ATLAS_VERSION, got: $installed" >&2; exit 1 ;;
          esac

      - name: Toolchain tests
        run: make e2e

  # The Forge editor SPA (controlplane/web) is a separate npm project the Go
  # gates never cover, so it gets its own job: typecheck, build and unit-test.
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: controlplane/web/package-lock.json

      - name: Install
        run: make web-install

      - name: Typecheck
        run: make web-check

      - name: Build
        run: make web-build

      - name: Test
        run: make web-test

      # The generated client must be what gombit generates from the committed
      # contract (controlplane/openapi.json), with the gombit CLI the control
      # plane pins. The contract itself is held to the code by the control
      # plane's Go tests.
      - uses: actions/setup-go@v7
        with:
          go-version-file: controlplane/go.mod
          cache: false

      - name: Generated client is current
        env:
          GOTOOLCHAIN: auto
        run: |
          go install "github.com/gombit-dev/gombit/cmd/gombit@$(cd controlplane && go list -m -f '{{.Version}}' github.com/gombit-dev/gombit)"
          make contract-check
# Informational, not a gate (mirrors gombit-docs' CI). The vulnerabilities
  # govulncheck surfaces are overwhelmingly in the pinned Go standard library
  # (fixed by a toolchain patch bump, not by any application change here);
  # hard-gating on them would keep CI red through no fault of a PR. Bumping the
  # Go toolchain to clear stdlib advisories is tracked separately.
  govulncheck:
    name: govulncheck (informational)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Dependency vulnerabilities (govulncheck)
        continue-on-error: true
        env:
          GOTOOLCHAIN: auto
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          "$(go env GOPATH)/bin/govulncheck" ./...
